<!doctype html>
<!-- Link-preview card for clearpathext.com. Render at 1200×630 (2× for a sharp
     2400×1260 export): Chromium/Playwright screenshot of this page. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 70% 90% at 72% 45%, #1A3561 0%, #0D1F3C 62%, #091731 100%);
    color: #fff; font-family: 'DM Sans', sans-serif; position: relative;
  }
  .copy { position: absolute; left: 88px; top: 140px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
  .brand img { height: 46px; }
  .brand span { font-family: 'DM Serif Display', serif; font-size: 34px; }
  h1 { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 76px; line-height: 1.02; margin: 0 0 28px; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #5B9BF8, #6DD9A8); -webkit-background-clip: text; color: transparent; }
  p { font-size: 25px; line-height: 1.45; color: #B4C3DA; margin: 0 0 34px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 999px;
          border: 1px solid rgba(91,155,248,.35); background: rgba(91,155,248,.08); color: #8FB8FA; font-size: 18px; }
  .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #6DD9A8; }
  .mark { position: absolute; right: 96px; top: 50%; transform: translateY(-50%); height: 370px;
          filter: drop-shadow(0 0 38px rgba(109,217,168,.28)) drop-shadow(0 0 80px rgba(91,155,248,.22)); }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../clearpath-mark.svg" alt=""><span>ClearPath</span></div>
    <h1>The web,<br><em>on your terms.</em></h1>
    <p>Free, open-source browser extension that makes any website easier to read.</p>
    <div class="pill">Free &amp; open source · No account required</div>
  </div>
  <img class="mark" src="../../clearpath-mark.svg" alt="">
</body>
</html>
